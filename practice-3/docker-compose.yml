services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: secret
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.multi
    environment:
      DB_HOST: db
      POSTGRES_PASSWORD: secret
    ports:
      - "8080:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
